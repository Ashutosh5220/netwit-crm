[phases.setup]
nixPkgs = ['nodejs_22', 'npm-10_x', 'php83', 'php83Packages.composer']

[phases.install]
cmds = [
    'mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx',
    'composer install --ignore-platform-reqs',
    'npm install'
]

[phases.build]
cmds = [
    'npm run build',
    'composer install --no-dev --optimize-autoloader'
]

[start]
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && /start-container.sh'